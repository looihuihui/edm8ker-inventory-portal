<!-- zones.html
     Purpose: Show all zones as clickable cards.
     Safe to edit: page title/subtitle text.
     Do NOT rename IDs unless you also update js/zones.js. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zones · Edm8ker Inventory Portal</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;700;800;900&family=Montserrat:wght@300;400;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <div class="app">
    <div class="phone">

      <div class="panel panel-top">
        <!-- Page top bar -->
        <div class="page-top">
          <button class="back-btn" id="backBtn" type="button" aria-label="Back">
            <img src="assets/icons/back.png" alt="Back">
          </button>

          <div class="page-title">
            <div class="page-h1">Zones</div>
            <div class="page-sub">List of all zones</div>
          </div>
        </div>

        <!-- Zones grid (rendered by js/zones.js) -->
        <div id="zonesGrid" class="zones-grid" aria-label="Zones list"></div>
      </div>

      <!-- Bottom nav -->
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html" id="nav-home" data-nav="home">
          <div class="bubble"><img class="nav-icon" src="assets/icons/home.png" alt="Home"></div>
          <div>Home</div>
        </a>

        <a href="search.html" id="nav-search" data-nav="search">
          <div class="bubble"><img class="nav-icon" src="assets/icons/search.png" alt="Search"></div>
          <div>Search</div>
        </a>

        <a href="zones.html" id="nav-zones" data-nav="zones">
          <div class="bubble"><img class="nav-icon" src="assets/icons/zones.png" alt="Zones"></div>
          <div>Zones</div>
        </a>

        <a href="add.html" id="nav-add" data-nav="add">
          <div class="bubble"><img class="nav-icon" src="assets/icons/add.png" alt="Add"></div>
          <div>Add</div>
        </a>
      </nav>

    </div>
  </div>

  <script type="module" src="js/zones.js"></script>
</body>
</html>
